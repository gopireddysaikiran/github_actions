name: MuleSoft CI/CD

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:


jobs:

  # ==========================================================
  # BUILD
  # ==========================================================
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5


      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # 3. Build Mule application
      - name: Build Mule application
        working-directory: hello-mule
        run: |
          mvn --batch-mode --no-transfer-progress clean package


      # 4. Upload generated Mule JAR
      - name: Upload Mule application artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-mule-package
          path: hello-mule/target/*-mule-application.jar


  # ==========================================================
  # DEPLOY
  # ==========================================================
  deploy:

    needs: build

    # Deploy only for push to main / manual execution.
    # Pull requests will build but will NOT deploy.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    environment: cloudhub-production

    steps:

      # 1. Checkout source code
      #
      # We need the pom.xml because the Mule Maven Plugin
      # contains the CloudHub 2.0 deployment configuration.
      #
      - name: Checkout code
        uses: actions/checkout@v5


      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # 3. Download the JAR produced by BUILD
      - name: Download Mule application artifact
        uses: actions/download-artifact@v5
        with:
          name: hello-mule-package
          path: artifact


      # 4. Verify artifact
      - name: Verify downloaded artifact
        run: |
          echo "Downloaded Mule application:"
          ls -lh artifact/


      # 5. Deploy the EXISTING artifact
      #
      # IMPORTANT:
      # mule:deploy deploys the JAR directly.
      # It does NOT run clean/package again.
      #
      - name: Deploy Mule application to CloudHub 2.0
        working-directory: hello-mule

        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

        run: |
          mvn --batch-mode --no-transfer-progress \
            mule:deploy \
            -Dmule.artifact="../artifact/hello-mule-1.0.0-mule-application.jar"