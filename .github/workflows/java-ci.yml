name: MuleSoft CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build Mule application
      - name: Build Mule application
        working-directory: hello-mule
        run: |
          mvn --batch-mode --no-transfer-progress clean package

      # 4. Upload Mule application JAR
      - name: Upload Mule application
        uses: actions/upload-artifact@v4
        with:
          name: hello-mule-package
          path: hello-mule/target/*-mule-application.jar


  # ==========================================================
  # DEPLOY JOB
  # ==========================================================
  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment: cloudhub-production

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Java 17 with Anypoint Exchange Maven credentials
      - name: Set up Java 17
        uses: actions/setup-java@v5
        env:
          EXCHANGE_USERNAME: "~~~Client~~~"
          EXCHANGE_PASSWORD: "2a52e2d639b640dc96d15e31c29049f7~?~580360d788174C369eF13dA1Ed997764"
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: anypoint-exchange-v3
          server-username: EXCHANGE_USERNAME
          server-password: EXCHANGE_PASSWORD

      # 3. Package, publish via Exchange API (avoids broken exchange-pre-deploy), then CloudHub 2.0
      - name: Publish to Exchange and deploy to CloudHub 2.0
        working-directory: hello-mule
        env:
          ANYPOINT_CLIENT_ID: "2a52e2d639b640dc96d15e31c29049f7"
          ANYPOINT_CLIENT_SECRET: "580360d788174C369eF13dA1Ed997764"
          ANYPOINT_URI: "https://anypoint.mulesoft.com"
          ANYPOINT_BUSINESS_GROUP_ID: "c33b559a-6e86-4aea-8f57-9b28faeb2881"
          ANYPOINT_ENVIRONMENT: "Sandbox"
          ANYPOINT_TARGET: "Cloudhub-US-East-2"
          ANYPOINT_APPLICATION_NAME: "hello-mule-saikiran"
          ANYPOINT_REPLICAS: "1"
          ANYPOINT_VCORES: "0.1"
          ASSET_GROUP_ID: "c33b559a-6e86-4aea-8f57-9b28faeb2881"
          ASSET_ID: "hello-mule"
          ASSET_VERSION: "1.0.1"

        run: |
          set -euo pipefail

          echo "Packaging hello-mule..."
          mvn --batch-mode --no-transfer-progress -e clean package -DskipTests

          JAR="target/${ASSET_ID}-${ASSET_VERSION}-mule-application.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected Mule jar not found: $JAR"
            ls -la target || true
            exit 1
          fi

          echo "Requesting Anypoint access token..."
          TOKEN_JSON="$(curl -sS -X POST "${ANYPOINT_URI}/accounts/api/v2/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" \
            --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}" \
            --data-urlencode "grant_type=client_credentials")"
          TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")"
          if [ -z "$TOKEN" ]; then
            echo "Failed to obtain Anypoint access token"
            printf '%s' "$TOKEN_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); d.pop('access_token', None); print(d)"
            exit 1
          fi

          echo "Publishing ${ASSET_ID}:${ASSET_VERSION} to Anypoint Exchange..."
          PUBLISH_URL="${ANYPOINT_URI}/exchange/api/v2/organizations/${ASSET_GROUP_ID}/assets/${ASSET_GROUP_ID}/${ASSET_ID}/${ASSET_VERSION}"
          HTTP_CODE="$(curl -sS -o /tmp/exchange-publish.json -w "%{http_code}" \
            -H "Authorization: bearer ${TOKEN}" \
            -H "x-sync-publication: true" \
            -F "files.pom=@pom.xml" \
            -F "files.mule-application.jar=@${JAR}" \
            "$PUBLISH_URL")"

          echo "Exchange publish HTTP status: ${HTTP_CODE}"
          cat /tmp/exchange-publish.json || true
          echo
          if [ "$HTTP_CODE" = "409" ]; then
            echo "Asset version already exists in Exchange; continuing to CloudHub deploy."
          elif [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Exchange publish failed"
            exit 1
          fi

          echo "Deploying to CloudHub 2.0..."
          mvn --batch-mode --no-transfer-progress -e \
            mule:deploy \
            -P cloudhub2-deploy \
            -DmuleDeploy \
            -Danypoint.uri="${ANYPOINT_URI}" \
            -Danypoint.businessGroupId="${ANYPOINT_BUSINESS_GROUP_ID}" \
            -Danypoint.environment="${ANYPOINT_ENVIRONMENT}" \
            -Danypoint.target="${ANYPOINT_TARGET}" \
            -Danypoint.applicationName="${ANYPOINT_APPLICATION_NAME}" \
            -Danypoint.replicas="${ANYPOINT_REPLICAS}" \
            -Danypoint.vCores="${ANYPOINT_VCORES}"